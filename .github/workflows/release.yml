name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Each job opts into just the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GENEFER_VARIANT: opencl
  # BOINC client_release/8.2/8.2.9; verify the tag before compiling it.
  BOINC_COMMIT: d56d870a5e7dad6c9f1a8c3b1075f11844b87ca2

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make curl unzip mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-opencl-headers mingw-w64-ucrt-x86_64-opencl-icd
      - name: Run the three CPU checks
        run: |
          python3 .github/scripts/test-release-files.py
          bash .github/scripts/cpu-checks.sh
      - name: Build with BOINC support
        run: bash .github/scripts/build-windows.sh
      - name: Check DLL dependencies and package
        run: python3 .github/scripts/release-files.py windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 (glibc 2.31)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ python3 curl \
            binutils xz-utils libgmp-dev ocl-icd-opencl-dev libboinc-app-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the three CPU checks
        run: |
          python3 .github/scripts/test-release-files.py
          bash .github/scripts/cpu-checks.sh
      - name: Build with BOINC support
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash .github/scripts/build-linux.sh
      - name: Check glibc and shared libraries, and package
        run: python3 .github/scripts/release-files.py linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attest and prepare draft release
    # Manual branch runs are build-only. Manual runs on a version tag also
    # prepare its draft. No job ever publishes a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare checksums and release notes
        run: python3 .github/scripts/release-files.py checksums
      - name: Attest the ZIPs
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.zip
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Refuse a moved tag, including annotated tags (the commits API peels them).
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test "$actual" = "$GITHUB_SHA"
          cp "$PROVENANCE" dist/provenance.sigstore.json
          if gh release view "$TAG" --json isDraft > existing-release.json; then
            test "$(jq -r .isDraft existing-release.json)" = true || {
              echo 'Refusing to modify a published release.' >&2
              exit 1
            }
            gh release edit "$TAG" --draft --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --verify-tag --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS dist/provenance.sigstore.json --clobber
